[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belka"
version = "0.1.0"
description = "Общий код: repository, uow, specification, schemas, pagination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dishka = [
    "dishka>=1.2",
]
auth = [
    "fastapi-users[sqlalchemy]>=14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "dishka>=1.2",
    "fastapi-users[sqlalchemy]>=14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/belka"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
